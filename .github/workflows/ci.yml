name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Branch-Namenskonvention
        if: github.event_name == 'pull_request'
        run: scripts/check-branch-name "${{ github.head_ref }}"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
      - name: pnpm-Version passt zu packageManager
        run: |
          want=$(node -p "require('./package.json').packageManager.split('@')[1]" 2>/dev/null || pixi run node -p "require('./package.json').packageManager.split('@')[1]")
          have=$(pixi run pnpm --version)
          echo "packageManager=$want pixi-pnpm=$have"
          test "$want" = "$have"
      - run: pixi run check
