# Pixi manages the whole repository: toolchain (Python, Node, pnpm, FFmpeg),
# tools (Biome, Ruff, Mypy, glslang) and all Python dependencies.
# npm packages not available on conda-forge are managed by pnpm (provided via Pixi).
[workspace]
name = "moviemakery2k"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]
requires-pixi = ">=0.81"

[dependencies]
python = "3.13.*"
nodejs = "24.*"
pnpm = "10.*"
ffmpeg = ">=7"
fastapi = ">=0.142"
uvicorn-standard = ">=0.54"
pydantic = ">=2.13"
python-multipart = ">=0.0.32"
pillow = ">=12"
# Export renderer (design.md D1, D8): headless GL via EGL.
moderngl = ">=5.12"
glcontext = ">=3"

[target.linux.dependencies]
# Both Linux targets (linux-64, linux-aarch64; design.md D1 of harden-export-and-ui).
# Mesa with the llvmpipe software renderer: EGL without a display, GPU or system packages.
mesalib = "*"

[activation.env]
# Do not mix in packages from ~/.local: the environment comes exclusively from pixi.lock.
PYTHONNOUSERSITE = "1"
# Playwright browsers inside the project instead of ~/.cache (see README: cache problems).
PLAYWRIGHT_BROWSERS_PATH = "$PIXI_PROJECT_ROOT/.pixi/playwright-browsers"

[target.linux.activation.env]
# Both Linux targets (linux-64, linux-aarch64).
# Headless EGL from the Pixi environment instead of system packages (design.md D1, D8):
# otherwise glvnd only looks for the Mesa ICD under /usr/share/glvnd/egl_vendor.d and
# glcontext only finds libEGL/libGL in the system via ldconfig.
__EGL_VENDOR_LIBRARY_DIRS = "$CONDA_PREFIX/share/glvnd/egl_vendor.d"
GLCONTEXT_LINUX_LIBEGL = "$CONDA_PREFIX/lib/libEGL.so.1"
GLCONTEXT_LINUX_LIBGL = "$CONDA_PREFIX/lib/libGL.so.1"

[pypi-dependencies]
mmy-backend = { path = "backend", editable = true }

[feature.dev.dependencies]
ruff = ">=0.16"
mypy = ">=2.3"
pytest = ">=9.1"
httpx2 = ">=2.13"
biome = "2.5.*"
glslang = ">=16"
jsonschema = ">=4.23"
types-jsonschema = "*"
playwright = ">=1.55"
pytest-playwright = ">=0.7"

[environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

# ---------------------------------------------------------------------------
# Tasks: the single command interface (pixi run <task>)
# ---------------------------------------------------------------------------
[tasks]
install-web = { cmd = "pnpm install --frozen-lockfile", inputs = ["package.json", "pnpm-lock.yaml", "apps/*/package.json", "packages/*/package.json"], outputs = ["node_modules/.modules.yaml"] }

dev-backend = { cmd = "python scripts/dev.py backend", description = "FastAPI with live reload (port: MMY_API_PORT, default 8000)" }
dev-web = { cmd = "python scripts/dev.py web", depends-on = ["install-web"], description = "Vite dev server with proxy /api → backend" }
dev = { cmd = "python scripts/dev.py", depends-on = ["install-web"], description = "Start backend and web app together" }

lint-web = "biome check ."
lint-backend = { cmd = "ruff check . && ruff format --check .", cwd = "backend" }
lint = { depends-on = ["lint-web", "lint-backend"] }

format = { cmd = "biome check --write . && ruff format backend && ruff check --fix backend" }

typecheck-web = { cmd = "pnpm -r typecheck", depends-on = ["install-web"] }
typecheck-backend = { cmd = "mypy src tests", cwd = "backend" }
typecheck = { depends-on = ["typecheck-web", "typecheck-backend"] }

test-web = { cmd = "pnpm -r test", depends-on = ["install-web"] }
test-backend = { cmd = "pytest", cwd = "backend" }
test = { depends-on = ["test-web", "test-backend"] }

build = { cmd = "pnpm -r build", depends-on = ["install-web"] }
demo = { cmd = "python scripts/dev.py demo", depends-on = ["build"], description = "Built web app + API from a single process (MMY_API_PORT, default 8000)" }

gen-api = { cmd = "python -m mmy_backend.openapi apps/web/src/generated/openapi.json && pnpm --filter @mmy/web exec openapi-typescript src/generated/openapi.json -o src/generated/schema.d.ts", depends-on = ["install-web"], description = "Generate TS types from the backend OpenAPI document" }

e2e-browsers = { cmd = "playwright install chromium", description = "Chromium for the E2E tests (into .pixi/playwright-browsers)" }
test-e2e = { cmd = "pytest -c e2e/pytest.ini e2e", depends-on = ["build", "e2e-browsers"], description = "Browser tests against backend + built web app" }

check-shaders = { cmd = "python scripts/check_shaders.py", description = "Compile GLSL ES 3.00 shaders and check them against the catalog" }

check-render-env = { cmd = "python scripts/check_render_env.py", description = "Export renderer: EGL/llvmpipe context, test frame, FFmpeg libx264 + aac" }
bench-export = { cmd = "python scripts/bench_export.py", description = "Export runtime: 12 images of 5 s each per profile (render and encode)" }

check = { depends-on = ["lint", "typecheck", "test", "check-shaders", "build"], description = "Quality gate: lint, typecheck, test, shaders, build" }
