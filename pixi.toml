# Pixi verwaltet das gesamte Repository: Toolchain (Python, Node, pnpm, FFmpeg),
# Werkzeuge (Biome, Ruff, Mypy, glslang) und alle Python-Abhängigkeiten.
# npm-Pakete, die es nicht auf conda-forge gibt, verwaltet pnpm (über Pixi bereitgestellt).
[workspace]
name = "moviemakery2k"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.81"

[dependencies]
python = "3.13.*"
nodejs = "24.*"
pnpm = "10.*"
ffmpeg = ">=7"
fastapi = ">=0.142"
uvicorn-standard = ">=0.54"
pydantic = ">=2.13"
python-multipart = ">=0.0.32"
pillow = ">=12"

[pypi-dependencies]
mmy-backend = { path = "backend", editable = true }

[feature.dev.dependencies]
ruff = ">=0.16"
mypy = ">=2.3"
pytest = ">=9.1"
httpx2 = ">=2.13"
biome = "2.5.*"
glslang = ">=16"

[environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
