[project]
name = "mmy-backend"
version = "0.2.0"
description = "moviemakerY2K backend: media, transition catalog, project and FFmpeg export"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
# Pixi installs the packages from conda-forge (pixi.toml); they are listed here as metadata only.
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "python-multipart>=0.0.32",
    "pillow>=12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmy_backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: encodes with FFmpeg (end-to-end export, a few seconds)",
]
