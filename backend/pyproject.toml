[project]
name = "mmy-backend"
version = "0.1.0"
description = "moviemakerY2K Backend: Medien, Übergangskatalog, Projekt und (später) FFmpeg-Export"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
# Die Pakete installiert Pixi aus conda-forge (pixi.toml); hier stehen sie nur als Metadaten.
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "python-multipart>=0.0.32",
    "pillow>=12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmy_backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
